name: Verify CI

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest   # usa Windows para rodar PowerShell
    env:
      ACCESS_TOKEN_EXPIRE_MINUTE: 30
      SECRET_KEY: 28hIJBUKULzM5WfQFZYoN5O6NiG1B3vm
      ALGORITHM: "HS256"

    steps:
      # 1. Checkout do código
      - name: Checkout código
        uses: actions/checkout@v3

      # 2. Configurar Python 3.12
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Instalar pipx e Poetry
        shell: pwsh
        run: |
          python -m pip install pipx
          pipx install poetry
          echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          poetry --version

      - name: Instalar dependências
        shell: pwsh
        run: |
          poetry install

      - name: Rodar testes
        shell: pwsh
        run: |
          poetry run pytest
